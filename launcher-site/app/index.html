<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>History</title>
<meta name="theme-color" content="#0b090e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="amb" id="amb"></div>
<header class="top"><img src="icon-192.png" alt=""><b>History</b><span id="pcPill" class="pill" hidden></span><button id="install" class="chip" hidden>⬇ Installer</button></header>

<section id="welcome" class="screen" hidden>
  <div class="hero glass"><img src="icon-192.png" alt=""><h1>Ton PC dans ta poche</h1><p>Lance tes jeux, surveille tes températures et parle à tes amis, même loin de chez toi.</p></div>
  <div class="glass step"><b>1</b><div><strong>Sur ton PC</strong><span>History Launcher › Paramètres › Téléphone</span></div></div>
  <div class="glass step"><b>2</b><div><strong>Scanne le QR</strong><span>avec l’appareil photo de ce téléphone. C’est tout.</span></div></div>
  <button class="ghost" id="useMail">Se connecter avec mon e-mail</button>
  <form id="loginForm" class="glass" hidden>
    <div id="cred"><input name="email" type="email" placeholder="E-mail" autocomplete="email"><input name="password" type="password" placeholder="Mot de passe" autocomplete="current-password"></div>
    <input name="code" id="code2fa" inputmode="numeric" maxlength="10" placeholder="Code de double authentification" hidden>
    <button class="main">Se connecter</button><p id="loginMsg" class="muted"></p>
  </form>
</section>

<main id="app" hidden>
  <section data-tab="pc" class="screen"></section>
  <section data-tab="amis" class="screen" hidden></section>
  <section data-tab="ticket" class="screen" hidden></section>
  <section data-tab="moi" class="screen" hidden></section>
</main>

<nav id="tabs" class="glass" hidden>
  <button data-go="pc" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Mon PC</button>
  <button data-go="amis"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.5-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.6c1.8.8 3 2.6 3.5 5.4"/></svg>Amis<em id="amisDot" hidden></em></button>
  <button data-go="ticket"><svg viewBox="0 0 24 24"><path d="M12 3c3 2 5 5.5 5 9.5L15 15H9l-2-2.5C7 8.5 9 5 12 3zM9 15l-2 4 3-1M15 15l2 4-3-1"/><circle cx="12" cy="9.5" r="1.8"/></svg>Opti Pro</button>
  <button data-go="moi"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.4-6 8-6s6.8 2 8 6"/></svg>Moi</button>
</nav>

<div class="sheet" id="sheet" hidden><div class="sheetbox glass" id="sheetBox"></div></div>
<dialog id="chat"><header class="top"><button class="back" id="chatBack">‹</button><b id="chatName"></b></header><div id="chatLog"></div><form id="chatForm"><input id="chatIn" maxlength="500" placeholder="Message…" autocomplete="off"><button class="main">➤</button></form></dialog>
<div class="toast" id="toast" hidden></div>
<script src="app.js" defer></script>
</body>
</html>
