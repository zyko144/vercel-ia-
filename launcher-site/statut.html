<main class="wrap page">
<h1>🟢 Statut des services</h1><p class="lead">Vérifié en direct depuis ton navigateur.</p>
<div class="cols" id="st"></div><p class="hint" id="stAt"></p>
<script>
const row = (n, ok, d) => `<div class="glass card"><h2>${n}</h2><b class="${ok ? 'ok' : 'bad'}">${ok ? '● En ligne' : '● Indisponible'}</b><p>${d}</p></div>`;
async function check() {
  const out = [row('Site', true, 'Tu es dessus 🙂')];
  const api = (await fetch('api.json').then((r) => r.json()).catch(() => ({}))).api;
  const t0 = performance.now(); const h = await fetch(api + '/health', { cache: 'no-store' }).then((r) => r.json()).catch(() => null); const ms = Math.round(performance.now() - t0);
  out.push(row('Serveur History (comptes, amis, IA, Opti Pro)', Boolean(h?.ok), h?.ok ? `Réponse en ${ms} ms` : 'Le serveur redémarre peut-être (mise à jour) : réessaie dans une minute.'));
  out.push(row('Bot Discord', Boolean(h?.discord?.ready ?? h?.discord), h ? (h.discord ? 'Connecté à Discord' : 'Hors ligne') : 'Inconnu (serveur injoignable)'));
  const rel = await fetch('https://api.github.com/repos/zyko144/vercel-ia-/releases/latest').then((r) => r.json()).catch(() => null);
  out.push(row('Téléchargements', Boolean(rel?.tag_name), rel?.tag_name ? `Dernière version : ${rel.tag_name}` : 'GitHub injoignable'));
  document.getElementById('st').innerHTML = out.join(''); document.getElementById('stAt').textContent = 'Vérifié à ' + new Date().toLocaleTimeString('fr-FR') + ' · actualisé chaque minute';
}
check(); setInterval(check, 60000);
</script>
</main>
