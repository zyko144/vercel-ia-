<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démo · AI Vercel</title>
<meta name="description" content="Le bot AI Vercel en action : IA, arcade, niveaux, boutique, duels, tickets et modération.">
<link rel="icon" href="/avatar.png">
<meta name="theme-color" content="#120f0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Crimson+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; --bg: #100d09; --bg2: #1b150e; --paper: #e8d6ae; --paper2: #d4b98a; --ink: #2a1606; --ink2: #5a3b1c; --text: #eadcc0; --muted: #a8977a; --accent: #c9a978; --gold: #f2c14e; --sea: #1fb5b0; --blood: #e0433a; --emerald: #3fbf6a; --royal: #7c6cff; --rose: #ff5fa2; --sky: #4aa8ff;
  --torn: polygon(0% 2%, 6% 0%, 13% 2%, 21% 0%, 30% 3%, 38% 0%, 47% 2%, 55% 0%, 64% 3%, 72% 1%, 81% 3%, 89% 0%, 96% 2%, 100% 0%, 99% 20%, 100% 41%, 98% 62%, 100% 83%, 99% 100%, 91% 98%, 83% 100%, 74% 97%, 66% 100%, 57% 98%, 49% 100%, 40% 97%, 31% 100%, 22% 98%, 13% 100%, 5% 97%, 0% 100%, 1% 79%, 0% 58%, 2% 37%, 0% 18%); }
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(ellipse at 30% 0%, #3a2a17 0%, var(--bg) 55%) fixed, var(--bg); color: var(--text); font: 18px/1.55 'Crimson Pro', Georgia, serif; }
a { color: inherit; }
h1, h2, h3, .brand, .btn { font-family: 'Cinzel', Georgia, serif; }
.container { width: min(1080px, 100% - 32px); margin-inline: auto; }
.nav { position: sticky; top: 0; z-index: 5; background: rgba(16,13,9,.88); backdrop-filter: blur(8px); border-bottom: 1px solid #3b2a17; }
.nav .container { display: flex; align-items: center; gap: 22px; height: 62px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--gold); font-weight: 700; text-decoration: none; }
.brand img { width: 30px; height: 30px; border-radius: 8px; }
.links { display: flex; gap: 18px; color: var(--muted); font-size: 16px; }
.links a { text-decoration: none; } .links a:hover, .links a.on { color: var(--gold); }
.nav .btn { margin-left: auto; }
@media (max-width: 760px) { .links { display: none; } }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 14px; color: #1b1208; background: linear-gradient(#f2c14e, #c9922e); box-shadow: 0 3px 0 #7a5418; text-decoration: none; }
.hero { text-align: center; padding: 56px 0 24px; }
.hero h1 { font-size: clamp(30px, 5vw, 48px); color: var(--gold); margin: 0 0 10px; text-shadow: 0 3px 0 #0008; }
.hero p { color: var(--muted); max-width: 640px; margin: 0 auto; }
.parchment { background: radial-gradient(ellipse at 40% 30%, #f3e4bf, var(--paper) 55%, var(--paper2) 85%, #a47a45); color: var(--ink); clip-path: var(--torn); padding: 26px 28px; filter: drop-shadow(0 10px 20px #000a); }
.parchment h2, .parchment h3 { color: var(--ink); margin: 0 0 6px; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.rise { animation: rise .6s ease both; }
footer { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; }

.stage { display: grid; grid-template-columns: 260px 1fr; gap: 20px; margin: 20px 0 40px; }
.scenes { display: flex; flex-direction: column; gap: 8px; }
.scene { text-align: left; border: 1px solid #3b2a17; background: #1c150d; color: var(--text); border-radius: 12px; padding: 12px 14px; cursor: pointer; font: 600 16px 'Crimson Pro', serif; transition: .2s; }
.scene b { display: block; }
.scene small { color: var(--muted); font-weight: 400; display: block; }
.scene.on { border-color: var(--gold); box-shadow: 0 0 18px #f2c14e33; }
.discord { background: #313338; color: #dbdee1; border-radius: 12px; font: 15px/1.4 'gg sans', 'Noto Sans', system-ui, sans-serif; overflow: hidden; box-shadow: 0 16px 40px #000c; min-height: 460px; }
.discord .bar { background: #2b2d31; padding: 12px 16px; font-weight: 600; color: #f2f3f5; border-bottom: 1px solid #1f2023; }
.msgs { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.m { display: grid; grid-template-columns: 40px 1fr; gap: 12px; animation: rise .45s ease both; }
.m .av { width: 40px; height: 40px; border-radius: 50%; background: #5865f2; display: grid; place-items: center; font-weight: 700; color: #fff; }
.m img.av { object-fit: cover; }
.m .who { font-weight: 600; color: #f2f3f5; }
.m .who .app { background: #5865f2; color: #fff; font-size: 10px; border-radius: 4px; padding: 1px 4px; margin-left: 6px; vertical-align: 2px; }
.m .who time { color: #949ba4; font-size: 12px; font-weight: 400; margin-left: 6px; }
.embed { border-left: 4px solid var(--c, #c9a978); background: #2b2d31; border-radius: 4px; padding: 10px 14px; margin-top: 6px; max-width: 520px; }
.embed .t { font-weight: 700; color: #f2f3f5; margin-bottom: 4px; }
.embed img { width: 100%; border-radius: 6px; margin-top: 8px; }
.btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.btns span { background: #4e5058; color: #fff; border-radius: 4px; padding: 6px 12px; font-size: 14px; }
.btns span.g { background: #248046; } .btns span.b { background: #5865f2; }
.typing { color: #949ba4; font-size: 13px; padding: 0 16px 12px; min-height: 18px; }
@media (max-width: 800px) { .stage { grid-template-columns: 1fr; } .scenes { flex-direction: row; overflow-x: auto; } .scene { min-width: 180px; } }

</style>
</head>
<body>
<header class="nav"><div class="container">
  <a class="brand" href="/"><img src="/avatar.png" alt="">AI Vercel</a>
  <nav class="links"><a href="/#fonctionnalites">Fonctionnalités</a><a href="/demo" class="on">Démo</a><a href="/nouveautes">Nouveautés</a><a href="/classement">Classement</a><a href="/#tarifs">Tarifs</a></nav>
  <a class="btn" href="/app">Tableau de bord</a>
</div></header>
<main>

<section class="hero container rise"><h1>🏴‍☠️ La démo du navire</h1><p>Regardez le bot en action, comme dans un vrai serveur. Choisissez une scène à gauche : les messages s’écrivent tout seuls.</p></section>
<section class="container"><div class="stage">
  <div class="scenes" id="scenes"></div>
  <div class="discord"><div class="bar"># <span id="chan">général</span></div><div class="msgs" id="msgs"></div><div class="typing" id="typing"></div></div>
</div></section>
<section class="container" style="text-align:center;margin-bottom:30px"><a class="btn" href="/#tarifs">Voir les offres</a></section>

</main>
<footer>AI Vercel · <a href="/">Accueil</a> · <a href="/statut">Statut</a> · <a href="/app">Tableau de bord</a></footer>
<script>
(function () {
  var ME = 'Lina';
  var BOT = { bot: true };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var SCENES = [
    { id: 'ia', emoji: '🧠', title: 'Parler à l’IA', text: 'Elle répond, se souvient, lance les jeux', chan: 'général', msgs: [
      { who: ME, text: '@AI Vercel tu peux lancer un quiz sur le rap FR pour ce soir ?' },
      { bot: true, text: 'Avec plaisir ! 🎤 Tournoi de quiz « rap FR », 10 questions, podium payé en pièces d’or. Clique pour ouvrir la salle d’attente.', btns: [['🏆 Lancer : Tournoi de quiz', 'g']] },
      { who: 'Sami', text: 'jsuis chaud 🔥' } ] },
    { id: 'arcade', emoji: '🕹️', title: 'L’arcade', text: 'Dessin, morpion, puissance 4 en Activité', chan: 'jeux', msgs: [
      { who: ME, text: '/jeux › Arcade' },
      { bot: true, embed: { c: '#c9a978', t: '🕹️ L’arcade du navire est ouverte !', d: 'Lina lance l’arcade : Dessine et devine, Morpion, Puissance 4… Tout le monde joue ensemble.', img: '/panneaux/jeux.gif' }, btns: [['🕹️ Ouvrir l’arcade', 'g'], ['🌐 Dans le navigateur', '']] } ] },
    { id: 'niveaux', emoji: '📈', title: 'Niveaux et or', text: 'Cartes parchemin, 200 pièces par niveau', chan: 'niveaux', msgs: [
      { bot: true, text: '🏴‍☠️🎉 @Lina passe **niveau 10** ! **+🪙 200 pièces d’or** · 📦 un coffre au trésor dans ta cale · nouveau titre : **Canonnier**' },
      { who: 'Noa', text: 'GG 👏' } ] },
    { id: 'boutique', emoji: '🪙', title: 'La boutique', text: 'Immunité, XP ×2, badges rares', chan: 'trésor', msgs: [
      { who: ME, text: '/serveur › Boutique du capitaine' },
      { bot: true, embed: { c: '#d9a441', t: '🏴‍☠️ Le comptoir du capitaine', d: 'Ta bourse : 🪙 4 250 pièces d’or\n🔥 Promo du jour : ⚡ XP doublée 24 h à -30 %', img: '/panneaux/boutique.gif' }, btns: [['🧰 Ma cale', 'g'], ['🎨 Rôle perso', 'b'], ['🤝 Donner des pièces', '']] } ] },
    { id: 'duel', emoji: '⚔️', title: 'Duels avec mise', text: 'Morpion, bataille navale, rimes…', chan: 'jeux', msgs: [
      { bot: true, embed: { c: '#c9a978', t: '❌ Morpion · mise 🪙 500', d: '@Lina défie @Sami ! Chacun mise 🪙 500 : le gagnant emporte 🪙 950.' }, btns: [['⚔️ Accepter', 'g'], ['Refuser', '']] },
      { who: 'Sami', text: 'accepté, prépare ton or 😤' } ] },
    { id: 'tickets', emoji: '🎫', title: 'Tickets', text: 'Motifs, résumé IA, note du support', chan: 'support', msgs: [
      { bot: true, embed: { c: '#1fb5b0', t: '🎫 Besoin d’aide ?', d: 'Choisis le motif de ton ticket : un salon privé s’ouvre avec le staff.', img: '/panneaux/ticket.gif' }, btns: [['🛒 Achat', ''], ['🐛 Bug', ''], ['🚨 Signalement', '']] },
      { bot: true, embed: { c: '#e0433a', t: '🗄️ Ticket n°0042 fermé', d: '🧠 Résumé : 🐛 le membre ne recevait pas sa récompense du jour · 🔧 le staff a réglé le salon · ✅ résolu en 6 min.' } } ] },
    { id: 'moderation', emoji: '🛡️', title: 'Modération', text: 'Anti-raid, sanctions progressives', chan: 'journal-du-bot', msgs: [
      { bot: true, embed: { c: '#ff3355', t: '📈 Sanction progressive : 3 avertissements', d: '@Troll42 : muet 1 h. Prochain palier : muet 1 jour.' } },
      { bot: true, embed: { c: '#ff9f2e', t: '🌡️ Le ton monte (7/10)', d: 'Dispute sur un match dans #général. Alerte de l’IA : jetez un œil, rien n’a été fait automatiquement.' } } ] },
  ];
  var box = document.getElementById('msgs');
  var clock = 1;
  var run = 0;
  function msgHtml(m) {
    var av = m.bot ? '<img class="av" src="/avatar.png" alt="">' : '<div class="av">' + esc(m.who[0]) + '</div>';
    var who = m.bot ? 'AI Vercel<span class="app">APP</span>' : esc(m.who);
    var text = m.text ? '<div>' + esc(m.text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</div>' : '';
    var embed = m.embed ? '<div class="embed" style="--c:' + m.embed.c + '"><div class="t">' + esc(m.embed.t) + '</div><div>' + esc(m.embed.d).replace(/\n/g, '<br>') + '</div>' + (m.embed.img ? '<img src="' + m.embed.img + '" alt="">' : '') + '</div>' : '';
    var btns = m.btns ? '<div class="btns">' + m.btns.map(function (b) { return '<span class="' + b[1] + '">' + esc(b[0]) + '</span>'; }).join('') + '</div>' : '';
    return '<div class="m">' + av + '<div><div class="who">' + who + '<time>aujourd’hui à 21:0' + (clock++ % 10) + '</time></div>' + text + embed + btns + '</div></div>';
  }
  function play(scene) {
    var id = ++run;
    box.innerHTML = '';
    document.getElementById('chan').textContent = scene.chan;
    document.querySelectorAll('.scene').forEach(function (b) { b.classList.toggle('on', b.dataset.id === scene.id); });
    var i = 0;
    (function next() {
      if (id !== run || i >= scene.msgs.length) { document.getElementById('typing').textContent = ''; return; }
      var m = scene.msgs[i++];
      document.getElementById('typing').textContent = (m.bot ? 'AI Vercel' : m.who) + ' est en train d’écrire…';
      setTimeout(function () { if (id !== run) return; box.insertAdjacentHTML('beforeend', msgHtml(m)); next(); }, 900);
    })();
  }
  document.getElementById('scenes').innerHTML = SCENES.map(function (s) { return '<button class="scene" data-id="' + s.id + '"><b>' + s.emoji + ' ' + esc(s.title) + '</b><small>' + esc(s.text) + '</small></button>'; }).join('');
  document.querySelectorAll('.scene').forEach(function (b) { b.addEventListener('click', function () { play(SCENES.find(function (s) { return s.id === b.dataset.id; })); }); });
  play(SCENES[0]);
  var k = 0;
  setInterval(function () { if (document.hidden) return; k = (k + 1) % SCENES.length; play(SCENES[k]); }, 12000);
})();
</script>
</body>
</html>
