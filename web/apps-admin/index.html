<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>History Apps · Support</title><link rel="stylesheet" href="/apps-admin/style.css"></head><body><header><span class="brand">HISTORY <em>APPS</em></span><span>Launcher & Clips</span><button id="logout" hidden>Déconnexion</button></header><main><section id="auth" class="card"><small>ESPACE ÉQUIPE · CONNEXION DISCORD</small><h1>Le support, au même endroit.</h1><p>Accès réservé au propriétaire et aux administrateurs autorisés du bot.</p><form id="login"><label>Ton identifiant Discord<input id="discordId" required pattern="[0-9]{15,21}" placeholder="Identifiant numérique Discord"></label><button>Recevoir mon lien en MP</button></form><button id="consume" hidden>Me connecter avec Discord</button><p id="authStatus" role="status"></p></section><section id="desk" hidden><div class="heading"><div><small>HISTORY / RELATION JOUEURS</small><h1>Centre de support</h1></div><button id="refresh">Actualiser ↻</button></div><div id="counts" class="counts"></div><div class="filters"><label>Application<select id="app"><option value="all">Toutes les apps</option><option value="launcher">History Launcher</option><option value="clips">History Clips</option></select></label><label>Statut<select id="status"><option value="all">Toutes les demandes</option><option value="received">Reçues</option><option value="investigating">En cours</option><option value="resolved">Résolues</option></select></label><label>Recherche<input id="search" type="search" placeholder="Nom, titre, message…"></label></div><p id="notice" role="status"></p><div id="tickets"></div></section></main><script src="/apps-admin/app.js" defer></script></body></html>
