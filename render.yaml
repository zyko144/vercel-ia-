services:
  - type: web
    name: vercel-ia
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Secrets : à remplir dans Render > Environment (jamais dans le repo)
      - key: DISCORD_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Token du bot Casinho (le casino). Sans lui, le casino reste simplement éteint.
      - key: TOKEN_CASINHO
        sync: false
      # E-mails du launcher (codes de vérification) : Brevo, avec l'adresse expéditeur vérifiée chez Brevo
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM
        sync: false
      # Bot History Clips (2e serveur) et lecture des versions GitHub sans limite
      - key: CLIPS_BOT_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # Connexion Discord du tableau de bord public (/app) et paiements
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: PAYPAL_EMAIL
        sync: false
      # Chiffrement des sauvegardes (npm run backup)
      - key: BACKUP_KEY
        sync: false
      # Le reste a déjà les bonnes valeurs par défaut dans src/config.js
