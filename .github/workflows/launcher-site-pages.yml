# Site du launcher publié sur GitHub Pages (https://zyko144.github.io/vercel-ia-/) à chaque changement de launcher-site/
name: Site du launcher (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['launcher-site/**', 'launcher/src/ui/**', 'launcher/src/core/**', '.github/workflows/launcher-site-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      # Démo jouable dans le navigateur : l'interface du launcher avec ses données d'exemple (aucune donnée réelle)
      - run: mkdir -p launcher-site/demo && cp -r launcher/src/ui launcher/src/core launcher-site/demo/
      # Fiches e-sport publiées par le workflow « E-sport - données Liquipedia » : on les garde
      - run: for f in data players; do curl -sfL "https://zyko144.github.io/vercel-ia-/esport/$f.json" -o "/tmp/$f.json" && mv "/tmp/$f.json" "launcher-site/esport/$f.json" || true; done
      - uses: actions/upload-pages-artifact@v3
        with: { path: launcher-site }
      - id: d
        uses: actions/deploy-pages@v4
