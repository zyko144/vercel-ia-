# Site du launcher publié sur GitHub Pages (https://zyko144.github.io/vercel-ia-/) à chaque changement de launcher-site/
name: Site du launcher (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['launcher-site/**', '.github/workflows/launcher-site-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with: { path: launcher-site }
      - id: d
        uses: actions/deploy-pages@v4
