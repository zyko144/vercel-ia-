# Publie l'installateur de History Launcher sur GitHub (Releases) à chaque nouvelle version du launcher.
# L'appli installée vérifie ces versions et se met à jour toute seule (electron-updater).
# Une version n'est publiée qu'une fois : il suffit d'augmenter "version" dans launcher/package.json.
name: Launcher - publier une nouvelle version

on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - name: Version du launcher
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Déjà publiée ?
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" --json assets -q '.assets[].name' 2>/dev/null | grep -qx latest.yml; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.yes == 'false'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Installation
        if: steps.exists.outputs.yes == 'false'
        run: npm ci --no-audit --no-fund

      - name: Construction de l'installateur
        if: steps.exists.outputs.yes == 'false'
        run: npx electron-builder --win --publish never

      - name: Notes de version et capture de la nouveauté
        if: steps.exists.outputs.yes == 'false'
        shell: bash
        run: |
          V="${{ steps.v.outputs.version }}"
          node ../tools/launcher-notes.mjs "$V" notes > dist/notes.md
          # Mode démo : bibliothèque, amis, benchmark et PC d'exemple pour que chaque capture montre la nouveauté
          export LAUNCHER_DEMO=1
          export LAUNCHER_DEMO_DIAG="$PWD/test/fixtures/diag-demo.json"
          N="$(node ../tools/launcher-notes.mjs "$V" shots)"
          [ "$N" -gt 0 ] || N=1
          for i in $(seq 0 $((N - 1))); do
            [ "$i" -eq 0 ] && OUT=apercu.png || OUT="apercu-$((i + 1)).png"
            export LAUNCHER_SHOT_JS="$(node ../tools/launcher-notes.mjs "$V" shotjs "$i")"
            export LAUNCHER_SHOT="$PWD/dist/$OUT"
            timeout 90 "dist/win-unpacked/History Launcher.exe" || true
          done
          ls -la dist/apercu*.png || echo "pas de capture"

      - name: Publication (tag + release avec latest.yml pour la mise à jour auto)
        if: steps.exists.outputs.yes == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.v.outputs.version }}"
          git tag "v$V" "$GITHUB_SHA" 2>/dev/null || true
          git push origin "v$V" || true
          # Empreintes SHA-256 : chacun peut vérifier que l'installateur téléchargé est bien l'original
          (cd dist && sha256sum *.exe > SHA256SUMS.txt)
          FILES=(dist/*.exe dist/*.exe.blockmap dist/latest.yml dist/SHA256SUMS.txt)
          for f in dist/apercu*.png; do [ -f "$f" ] && FILES+=("$f"); done
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "${FILES[@]}" --clobber
            gh release edit "v$V" --notes-file dist/notes.md
          else
            gh release create "v$V" --verify-tag --title "History Launcher $V" --notes-file dist/notes.md "${FILES[@]}"
          fi

      # Toujours lancé (même si la version existait déjà) : le bot n'annonce jamais deux fois la même version,
      # et un lancement à la main (workflow_dispatch) rattrape une annonce ratée
      - name: Prévenir le bot Discord (annonce tout de suite)
        shell: bash
        run: |
          # Le service Render peut être en veille : plusieurs essais, sans jamais faire échouer la publication
          # Le bot redémarre souvent au même moment (déploiement Render) : on réessaie jusqu'à ce que l'annonce soit postée
          V="${{ steps.v.outputs.version }}"
          for i in $(seq 1 12); do
            R=$(curl -fsS -m 90 -X POST "https://vercel-ia.onrender.com/api/launcher/annonce?version=$V" || true)
            echo "$R"
            if echo "$R" | grep -Eq '"(posted|already)": ?true'; then break; fi
            sleep 30
          done || true
