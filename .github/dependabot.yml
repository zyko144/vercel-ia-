# Mises à jour de sécurité automatiques des dépendances (proposées en pull request, jamais fusionnées sans toi)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /launcher
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /clips
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
